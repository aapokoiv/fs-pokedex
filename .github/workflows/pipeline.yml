name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Check style
        run: npm run eslint
      - name: Run tests
        run: npm run test
      - name: Run build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test

  deploy:
    needs: build_and_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: curl --fail-with-body ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify_success:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord of success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Deployment successful"
          description: |
            **Commit**: `${{ github.sha }}`
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** `${{ github.actor }}`
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify_failure:
    needs: [build_and_test, deploy]
    if: ${{ always() && (needs.build_and_test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord of failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Deployment failed"
          description: |
            **Repository:** `${{ github.repository }}`.
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** `${{ github.actor }}`
            **Workflow:** `${{ github.workflow }}`
            **Job:** `${{
              needs.build_and_test.result == 'failure' && 'build_and_test' ||
              needs.deploy.result == 'failure' && 'deploy' ||
              'unknown'
            }}`

            [View commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  tag_release:
    needs: [deploy]
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '#skip')

    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
